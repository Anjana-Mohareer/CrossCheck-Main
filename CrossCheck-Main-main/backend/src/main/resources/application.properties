spring.application.name=crosscheck-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/crosscheck;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
crosscheck.upload-dir=uploads


# Email service (Gmail example). Keep disabled until valid SMTP credentials are supplied.
crosscheck.mail.enabled=${CROSSCHECK_MAIL_ENABLED:false}
crosscheck.mail.from=${CROSSCHECK_MAIL_FROM:${MAIL_USERNAME:no-reply@crosscheck.local}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
